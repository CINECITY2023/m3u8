name: Extraer M3U8 de YouTube

on:
  workflow_dispatch:  # Se ejecuta manualmente desde GitHub

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Instalar yt-dlp
      run: pip install yt-dlp

    - name: Ejecutar script con URL fija (puedes cambiarla)
      run: |
        python extraer_m3u8.py "https://www.youtube.com/watch?v=OR9MH16MKrg"

    - name: Guardar resultado como artefacto
      uses: actions/upload-artifact@v3
      with:
        name: enlace_m3u8
        path: enlace_m3u8.txt

