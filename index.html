<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Player - Premium</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background-color: #0b0e14;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    height: 100%;
    display: block;
    overflow-y: auto;
    padding: 30px 20px;
}

.header-container {
    max-width: 1200px;
    margin: 0 auto 30px auto;
    text-align: center;
}

.site-title {
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    color: #ffffff;
}

.site-subtitle {
    font-size: 20px;
    font-weight: normal;
    margin-bottom: 25px;
    color: #ffffff;
}

.controls-row {
    max-width: 900px;
    margin: 0 auto 20px auto;
    display: block;
    text-align: center;
}

.search-box-container {
    margin-bottom: 15px;
    position: relative;
}

.search-box-container input {
    width: 100%;
    max-width: 800px;
    padding: 14px 20px;
    border: 1px solid #1a2233;
    border-radius: 8px;
    background: #0f141c;
    color: #ffffff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}

.search-box-container input:focus {
    border-color: #0099ff;
}

.playlist-selector-container {
    margin-bottom: 25px;
}

.playlist-selector-container select {
    width: 100%;
    max-width: 400px;
    padding: 12px 15px;
    border: 1px solid #1a2233;
    border-radius: 8px;
    background: #0f141c;
    color: #ffffff;
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

.channels-counter {
    font-size: 16px;
    color: #ffffff;
    margin-bottom: 25px;
    text-align: center;
    font-weight: normal;
}

/* Contenedor principal de los canales */
#channelList {
    max-width: 1200px;
    margin: 0 auto;
}

.group-section {
    margin-bottom: 35px;
    display: block;
    clear: both;
}

.group-title {
    font-size: 18px;
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1a2233;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.grid-channels {
    display: block;
    text-align: center;
}

/* Tarjeta de canal basada en la imagen de referencia */
.channel-card {
    display: inline-block;
    width: 220px;
    background: #0f141c;
    border: 1px solid #1a2233;
    border-radius: 12px;
    padding: 20px 15px 15px 15px;
    margin: 10px;
    text-align: center;
    vertical-align: top;
    transition: transform 0.2s, border-color 0.2s;
}

.channel-card:hover {
    transform: translateY(-4px);
    border-color: #22314d;
}

/* --- NUEVO ESTILO: ETIQUETA ROJA EXCLUSIVA --- */
.red-label {
    display: block;
    color: #b8ad8e;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
    text-transform: lowercase;
    min-height: 14px; /* Mantiene la simetría si un canal no tiene etiqueta */
}

.country-tag {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.logo-wrapper {
    height: 75px;
    display: block;
    margin-bottom: 15px;
    text-align: center;
}

.channel-logo {
    max-width: 110px;
    max-height: 65px;
    object-fit: contain;
    vertical-align: middle;
}

.channel-name {
    font-size: 15px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-watch {
    display: block;
    width: 100%;
    background: #0094ec;
    color: #ffffff;
    border: none;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
}

.btn-watch:hover {
    background: #0080cc;
}

.loading, .error {
    padding: 40px;
    text-align: center;
    font-size: 16px;
    color: #8a99ad;
}

.error {
    color: #ff4d4d;
}
</style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <div class="site-title">TVLIBRE-Premium</div>
        <div class="site-subtitle">Canales online en vivo y en directo Gratis</div>
    </div>

    <div class="controls-row">
        <div class="search-box-container">
            <input type="text" id="search" placeholder="Buscar canal o etiqueta..">
        </div>
        <div class="playlist-selector-container">
            <select id="playlistSelect">
                <option>Cargando listas de canales...</option>
            </select>
        </div>
    </div>

    <div id="counterContainer" class="channels-counter" style="display:none;">
        <span id="totalCount">0</span> canales
    </div>

    <div id="channelList">
        <div class="loading">Cargando canales y categorías...</div>
    </div>
</div>

<script>
const LISTA_URL = "https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/scripts-album/listas/test.txt";
let jsonActual = "", listasDisponibles = [], canalesGlobal = [], timerBusqueda = null;

async function cargarListas() {
    try {
        const response = await fetch(LISTA_URL, { cache: "no-store" });
        const texto = await response.text();
        listasDisponibles = texto.split("\n").map(l => l.trim()).filter(Boolean).map(linea => {
            const p = linea.split("|");
            return p.length >= 2 ? { nombre: p[0], url: p[1] } : null;
        }).filter(Boolean);

        const select = document.getElementById("playlistSelect");
        select.innerHTML = "";
        listasDisponibles.forEach((lista, index) => {
            const option = document.createElement("option");
            option.value = lista.url;
            option.textContent = lista.nombre;
            select.appendChild(option);
            if (index === 0) jsonActual = lista.url;
        });

        select.addEventListener("change", function() {
            jsonActual = this.value;
            localStorage.setItem("ultimaLista", jsonActual);
            loadChannels();
        });

        loadChannels();
    } catch (e) {
        console.error(e);
        document.getElementById("channelList").innerHTML = '<div class="error">Error al conectar con el servidor de listas</div>';
    }
}

async function loadChannels() {
    const list = document.getElementById("channelList");
    list.innerHTML = '<div class="loading">Cargando canales...</div>';
    try {
        const response = await fetch(jsonActual, { cache: "no-store" });
        const canales = await response.json();
        canalesGlobal = canales.filter(c => c.activo);
        
        // Actualizar contador total
        const counter = document.getElementById("counterContainer");
        const totalCount = document.getElementById("totalCount");
        totalCount.textContent = canalesGlobal.length;
        counter.style.display = "block";

        renderChannels(canalesGlobal);
    } catch (e) {
        list.innerHTML = '<div class="error">Error cargando canales de esta lista</div>';
    }
}

function renderChannels(canales) {
    const list = document.getElementById("channelList");
    const fragment = document.createDocumentFragment();
    const grupos = {};

    canales.forEach(c => {
        const g = c.grupo || "Canales generales";
        (grupos[g] ||= []).push(c);
    });

    Object.keys(grupos).forEach(grupo => {
        const section = document.createElement("div");
        section.className = "group-section";

        const titulo = document.createElement("div");
        titulo.className = "group-title";
        titulo.textContent = grupo;
        section.appendChild(titulo);

        const grid = document.createElement("div");
        grid.className = "grid-channels";

        grupos[grupo].forEach(canal => {
            const card = document.createElement("div");
            card.className = "channel-card";
            
            const tagText = canal.grupo ? canal.grupo.split(" ")[0] : "Online";
            
            // Evaluamos si el canal trae la propiedad "etiqueta" en el JSON, de lo contrario la dejamos vacía.
            const etiquetaHTML = canal.etiqueta ? `<div class="red-label">${canal.etiqueta}</div>` : `<div class="red-label"></div>`;

            card.innerHTML = `
                ${etiquetaHTML}
                <div class="country-tag">${tagText}</div>
                <div class="logo-wrapper">
                    <img class="channel-logo" loading="lazy" src="${canal.logo}" alt="${canal.nombre}" onerror="this.src=''">
                </div>
                <div class="channel-name">${canal.nombre}</div>
                <button class="btn-watch">Ver canal</button>
            `;

            card.addEventListener("click", () => {
                window.open(canal.url, "_blank");
            });

            grid.appendChild(card);
        });

        section.appendChild(grid);
        fragment.appendChild(section);
    });

    list.replaceChildren(fragment);
}

document.getElementById("search").addEventListener("input", function() {
    clearTimeout(timerBusqueda);
    const texto = this.value.toLowerCase();
    timerBusqueda = setTimeout(() => {
        // Modificado para que busque tanto por el NOMBRE del canal como por su ETIQUETA
        const filtrados = canalesGlobal.filter(c => {
            const nombreCoincide = c.nombre.toLowerCase().includes(texto);
            const etiquetaCoincide = c.etiqueta ? c.etiqueta.toLowerCase().includes(texto) : false;
            return nombreCoincide || etiquetaCoincide;
        });
        document.getElementById("totalCount").textContent = filtrados.length;
        renderChannels(filtrados);
    }, 200);
});

cargarListas();
</script>
</body>
</html>
