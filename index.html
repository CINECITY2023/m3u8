<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ariel TV Mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: sans-serif;
        }

        body { display: flex; }

        .sidebar {
            width: 220px;
            background: #111;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        .sidebar-header {
            background: linear-gradient(90deg, #1a0000, #330000);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header img { margin-left: 40px; width: 100px; height: 40px; }

        .sidebar-header h2 { color: white; font-size: 18px; }

        .grupo-titulo {
            padding: 10px;
            background: #181818;
            color: #00ffcc;
            text-align: center;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .lista-canales {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .canal {
            background: #222;
            border-radius: 10px;
            margin-bottom: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            color: #fff;
            cursor: pointer;
            border: 1px solid #333;
        }

        .canal:hover { background: #333; }

        .canal span { flex: 1; font-size: 14px; }

        .canal img {
            width: 32px;
            height: 32px;
            margin-left: auto;
        }

        .canal.activo {
            background: linear-gradient(90deg, #00ffcc33, #00ffcc11);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 8px #00ffcc55;
        }

        .canal.activo span {
            color: #00ffcc;
            font-weight: bold;
        }

        .player {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: black;
        }

        .video-container video,
        .video-container iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            object-fit: contain;
        }

        .barra-grupos {
            height: 50px;
            background: #0d0d0d;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 10px;
            overflow-x: auto;
        }

        .grupo-icono {
            min-width: 40px;
            height: 30px;
            background: #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #333;
            font-size: 18px;
        }

        .grupo-icono.active { background: #00ffcc; }

        .zona-inferior {
            height: 80px;
            background: #111;
            border-top: 1px solid #333;
            padding: 15px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-inferior {
            width: 60px;
            height: 60px;
            display: none;
        }

        .info-texto h3 { font-size: 18px; }

        .info-texto p {
            font-size: 14px;
            opacity: 0.7;
        }

        .hora-actual {
            margin-left: auto;
            font-size: 22px;
            color: #00ffcc;
        }
    </style>

<link rel="icon" href="logo.png" type="image/x-icon">

</head>

<body>

<div class="sidebar">

    <div class="sidebar-header">
        <img src="https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/logos/LOGO2.png" alt="Logo">
       
    </div>
 <select id="selectorListas" style="margin:10px; padding:8px; background:#222; color:white; border-radius:8px; border:none;"></select>
    <div class="grupo-titulo" id="grupoTitulo">Todos los canales</div>
    <div class="lista-canales" id="listaCanales"></div>
</div>

<div class="player">
    <div class="video-container" id="player"></div>
    <div class="barra-grupos" id="barraGrupos"></div>

    <div class="zona-inferior">
        <img id="logoInferior" class="logo-inferior">
        <div class="info-texto" id="infoTexto">
            <h3>Bienvenido</h3>
            <p>Selecciona un canal</p>
        </div>
        <div class="hora-actual" id="horaActual"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest"></script>



<script>


let listas = [];

async function cargarListasRemotas() {
    try {
        const res = await fetch("https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/scripts-album/Mobile-lista.txt"); // ← ponés tu txt o json
        const texto = await res.text();

        // separar por líneas
        listas = texto.split("\n").map(l => l.trim()).filter(l => l);

        mostrarListas();
        cargarLista(listas[0]);

    } catch (e) {
        console.error("Error cargando listas:", e);
    }
}


const selector = document.getElementById("selectorListas");

selector.addEventListener("change", (e) => {
    cargarLista(e.target.value);
});

function mostrarListas() {
    selector.innerHTML = "";

    listas.forEach((url, index) => {
        const option = document.createElement("option");

        const nombre = url.split("/").pop().replace(".json", "");

        option.value = url;
        option.textContent = nombre.toUpperCase();

        if (index === 0) option.selected = true;

        selector.appendChild(option);
    });
}

let canales = [];

async function cargarLista(url) {
    try {
        const res = await fetch(url);
        canales = await res.json();

        grupoActual = "TODOS";

        mostrarGrupos();
        mostrarCanales();

    } catch (e) {
        console.error("Error cargando lista:", e);
    }
}

let grupoActual = "TODOS";

const lista = document.getElementById("listaCanales");
const player = document.getElementById("player");
const barraGrupos = document.getElementById("barraGrupos");
const grupoTitulo = document.getElementById("grupoTitulo");
const logoInferior = document.getElementById("logoInferior");
const infoTexto = document.getElementById("infoTexto");
const horaActual = document.getElementById("horaActual");

function marcarCanalActivo(div) {
    document.querySelectorAll(".canal").forEach(c => c.classList.remove("activo"));
    div.classList.add("activo");
}

function cargarCanal(url, nombre, logo) {
    player.innerHTML = "";

    const mostrarInfo = () => {
        if (logo) {
            logoInferior.src = logo;
            logoInferior.style.display = "block";
        } else {
            logoInferior.style.display = "none";
        }

        infoTexto.innerHTML = `
            <h3>${nombre}</h3>
            <p>${url.split("/").slice(0, 3).join("/")}</p>
        `;
    };

    // ===== VIDEO =====
    const video = document.createElement("video");
    video.autoplay = true;
    video.muted = true;
    video.controls = true;
    video.playsInline = true;
    video.style.width = "100%";
    video.style.height = "100%";

    // ===== HLS =====
    if (url.includes(".m3u8")) {

        player.appendChild(video);

        if (Hls.isSupported()) {

            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {

            video.src = url;
            video.play();
        }

        mostrarInfo();
        return;
    }

    // ===== MPEGTS =====
    if (
        url.includes("/play/") ||
        url.includes(":8000/")
    ) {

        player.appendChild(video);

        if (mpegts.getFeatureList().mseLivePlayback) {

            const tsPlayer = mpegts.createPlayer({
                type: 'mpegts',
                isLive: true,
                url: url
            });

            tsPlayer.attachMediaElement(video);
            tsPlayer.load();

            tsPlayer.play().catch(() => {});

            mostrarInfo();
            return;
        }
    }

    // ===== IFRAME =====
    const iframe = document.createElement("iframe");

    iframe.src = url;
    iframe.allow = "fullscreen; encrypted-media";
    iframe.allowFullscreen = true;

    player.appendChild(iframe);

    mostrarInfo();
	
	
    // 🔒 clave anti-popup


    iframe.allowFullscreen = true;

    player.appendChild(iframe);
    mostrarInfo();
}

function mostrarGrupos() {
    barraGrupos.innerHTML = "";
    crearGrupo("TODOS", "📺");

    const map = {};
    canales.forEach(c => map[c.grupo] = c.icono);

    Object.entries(map).forEach(([g, i]) => crearGrupo(g, i));
    barraGrupos.firstChild.classList.add("active");
}

function crearGrupo(nombre, icono) {
    const d = document.createElement("div");
    d.className = "grupo-icono";
    d.textContent = icono;

    d.onclick = () => {
        document.querySelectorAll(".grupo-icono").forEach(x => x.classList.remove("active"));
        d.classList.add("active");
        grupoActual = nombre;
        grupoTitulo.textContent = nombre === "TODOS" ? "Todos los canales" : nombre;
        mostrarCanales();
    };

    barraGrupos.appendChild(d);
}

function mostrarCanales() {
    lista.innerHTML = "";
   const filtrados = (grupoActual === "TODOS"
    ? canales
    : canales.filter(c => c.grupo === grupoActual)
).filter(c => c.activo);

    filtrados.forEach(c => {
        const d = document.createElement("div");
        d.className = "canal";
        d.innerHTML = `
            <span>${c.nombre}</span>
            ${c.logo ? `<img src="${c.logo}">` : ""}
        `;
        d.onclick = () => {
            marcarCanalActivo(d);
            cargarCanal(c.url, c.nombre, c.logo);
        };
        lista.appendChild(d);
    });

    if (filtrados[0]) {
        marcarCanalActivo(lista.firstChild);
        cargarCanal(filtrados[0].url, filtrados[0].nombre, filtrados[0].logo);
    }
}

setInterval(() => {
    const d = new Date();
    horaActual.textContent =
        `${String(d.getHours()).padStart(2, "0")}:` +
        `${String(d.getMinutes()).padStart(2, "0")}:` +
        `${String(d.getSeconds()).padStart(2, "0")}`;
}, 1000);

cargarListasRemotas();
</script>

</body>
</html>
